version: "3.9"

services:
  api-gateway:
    image: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - order-service
      - notification-service

  auth-service:
    image: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=authuser
      - SPRING_DATASOURCE_PASSWORD=authpassword
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpassword
      - POSTGRES_DB=auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  user-service:
    image: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/user_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - user-db
      - kafka-broker

  user-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=user_db
    volumes:
      - user-db-data:/var/lib/postgresql/data

  product-service:
    image: product-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://product-db:27017/product_db
    depends_on:
      - product-db
      - kafka-broker

  product-db:
    image: mongo:latest
    volumes:
      - product-db-data:/data/db

  inventory-service:
    image: inventory-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=inventory
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - inventory-db
      - product-service
      - kafka-broker

  inventory-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=inventory
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=inventory_db
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  order-service:
    image: order-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=order
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - order-db
      - inventory-service
      - kafka-broker

  order-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=order
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=order_db
    volumes:
      - order-db-data:/var/lib/postgresql/data

  notification-service:
    image: notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://notification-db:27017/notification_db
    depends_on:
      - notification-db
      - kafka-broker

  notification-db:
    image: mongo:latest
    volumes:
      - notification-db-data:/data/db

volumes:
  auth-db-data:
  user-db-data:
  product-db-data:
  inventory-db-data:
  order-db-data:
  notification-db-data:
  kafka-data: