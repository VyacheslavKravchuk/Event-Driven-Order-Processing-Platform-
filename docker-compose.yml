services:
  api-gateway:
    image: api-gateway
    ports:
      - "8088:8088"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - order-service
      - notification-service

  kafka-broker:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CLUSTER_ID: "Mk-Sl-b903eO_A8mY0yNkg"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAME: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    image: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - auth-db
      - kafka-broker

  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-service:
    image: user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - user-db
      - kafka-broker

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: inventory_db
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  inventory-service:
    image: inventory-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - inventory-db
      - kafka-broker

  product-db:
    image: mongo:latest
    container_name: product-db
    ports:
      - "27018:27017"
    volumes:
      - product-db-data:/data/db

  product-service:
    image: product-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://product-db:27017/product_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - product-db
      - kafka-broker

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: order_db
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  order-service:
    image: order-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - order-db
      - inventory-service
      - user-service
      - kafka-broker

  notification-db:
    image: mongo:latest
    container_name: notification-db
    ports:
      - "27019:27017"
    volumes:
      - notification-db-data:/data/db

  notification-service:
    image: notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://notification-db:27017/notification_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - notification-db
      - kafka-broker

volumes:
  auth-db-data:
  user-db-data:
  product-db-data:
  inventory-db-data:
  order-db-data:
  notification-db-data:
  kafka-data:
