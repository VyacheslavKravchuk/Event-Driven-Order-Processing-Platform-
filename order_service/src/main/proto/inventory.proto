syntax = "proto3";

package com.inovexx.inventory.grpc;

option java_multiple_files = true;
option java_package = "com.inovexx.inventory.grpc";
option java_outer_classname = "InventoryProto";

// Сервис для управления запасами и резервированием товаров
service InventoryService {
  // Batch-резервирование товаров (транзакционное, идемпотентное)
  rpc ReserveBatchStock (ReserveBatchRequest) returns (ReserveBatchResponse);

  // Отмена резервации (компенсирующая операция для Саги)
  rpc CancelBatchReservation (CancelReservationRequest) returns (CancelReservationResponse);

  // Фиксация списания после успешной оплаты
  rpc CommitBatchReduction (CommitReductionRequest) returns (CommitReductionResponse);
}

// Структура позиции товара в заказе
message OrderItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

// --- Запрос на резервирование ---
message ReserveBatchRequest {
  string order_id = 1;                  // Уникальный идентификатор заказа (может быть UUID)
  repeated OrderItemRequest items = 2;    // Список товаров для резервации
  string idempotency_key = 3;           // Ключ идемпотентности (опционально, но рекомендуется)
}

// Ответ на резервирование
message ReserveBatchResponse {
  bool success = 1;
  ReservationError error = 2;            // Код ошибки
  string message = 3;                   // Описание ошибки (если есть)
}

// --- Запрос на отмену резервации ---
message CancelReservationRequest {
  string order_id = 1;                  // Уникальный идентификатор заказа
  repeated OrderItemRequest items = 2;    // Список товаров для отмены
  string idempotency_key = 3;           // Ключ идемпотентности (опционально)
}

// Ответ на отмену
message CancelReservationResponse {
  bool success = 1;
  ReservationError error = 2;
  string message = 3;
}

// --- Запрос на фиксацию списания ---
message CommitReductionRequest {
  string order_id = 1;                  // Уникальный идентификатор заказа
  string idempotencyKey = 2; // для идемпотентности
}

message CommitReductionResponse {
  bool success = 1;
  ReservationError error = 2;
  string message = 3;
}

// Коды ошибок резервирования
enum ReservationError {
    IDEMPOTENCY_VIOLATION = 0;  // Идемпотентность нарушена
    NO_ACTIVE_RESERVATIONS = 1;  // Нет активных резервов
    INSUFFICIENT_STOCK = 2;     // Недостаточно товара
    INTERNAL_ERROR = 3;          // Внутренняя ошибка
}