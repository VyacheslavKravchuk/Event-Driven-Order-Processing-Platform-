spring.application.name=order-service

server.port=8085

spring.kafka.producer.bootstrap-servers=localhost:9092
# Docker: spring.kafka.producer.bootstrap-servers=kafka:9092
kafka.topic.order-events=order.events

spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# gRPC
grpc.server.port=9090

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# gRPC (inventory-service)
grpc.client.inventory-service.address=static://localhost:9091
grpc.client.inventory-service.negotiation-type=plaintext

