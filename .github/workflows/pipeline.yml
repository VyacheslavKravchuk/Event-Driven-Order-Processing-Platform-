name: Service pipeline

on:
  pull_request:
    branches:
      - master
      - dev
      - 'feature/*'
    types:
      - opened
      - reopened
      - synchronize

# Список микросервисов
env:
  SERVICES: '["api-gateway", "auth-service", "user-service", "product-service", "inventory-service", "order-service", "notification-service"]'

jobs:
  check_build_test:
    runs-on: ubuntu-latest
    env:
      SERVICES_LIST: ${{ fromJson(env.SERVICES) }} # Преобразуем строку в список в рамках job
    strategy:
      matrix:
        service: ${{ fromJson(env.SERVICES) }} # Преобразуем строку в список

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install dependencies for ${{ matrix.service }}
        run: ./mvnw install -DskipTests=true -f ${{ matrix.service }}/pom.xml

      - name: Run Unit Tests for ${{ matrix.service }}
        run: ./mvnw test -f ${{ matrix.service }}/pom.xml

      - name: Run Checkstyle for ${{ matrix.service }}
        run: ./mvnw checkstyle:checkstyle -f ${{ matrix.service }}/pom.xml

      - name: Generate JaCoCo Coverage Report for ${{ matrix.service }}
        run: ./mvnw org.jacoco:jacoco-maven-plugin:prepare-agent process-classes org.jacoco:jacoco-maven-plugin:report -f ${{ matrix.service }}/pom.xml

      - name: Check JaCoCo Coverage for ${{ matrix.service }}
        run: |
          JACOCO_COVERAGE=$(( $(mvn org.jacoco:jacoco-maven-plugin:report -f ${{ matrix.service }}/pom.xml | grep "lines.covered" | awk '{print $3}' | tr -d '%') ))
          echo "Coverage: $JACOCO_COVERAGE%"
          if [[ "$JACOCO_COVERAGE" -lt "80" ]]; then
            echo "Code coverage is less than 80%. Failing the build."
            exit 1
          fi

  docker_build_push:
    runs-on: ubuntu-latest
    needs: check_build_test
    env:
      SERVICES_LIST: ${{ fromJson(env.SERVICES) }} # Преобразуем строку в список в рамках job
    strategy:
      matrix:
        service: ${{ fromJson(env.SERVICES) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for ${{ matrix.service }}
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
