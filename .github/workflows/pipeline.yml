name: Service pipeline

on:
  pull_request:
    branches:
      - master
      - dev
      - 'feature/*'
    types:
      - opened
      - reopened
      - synchronize

# Список микросервисов
env:
  SERVICES: '["api-gateway", "auth-service", "user-service", "product-service", "inventory-service", "order-service", "notification-service"]'

jobs:
  # Эта работа просто определяет список сервисов и передает его как output
  define_services:
    runs-on: ubuntu-latest
    outputs:
      service_list: ${{ steps.set_services.outputs.service_list }} # Указываем на output шага set_services
    steps:
      - name: Set Service List as Output
        id: set_services
        run: echo "service_list=${{ env.SERVICES }}" >> $GITHUB_OUTPUT # Записываем в файл окружения

  check_build_test:
    runs-on: ubuntu-latest
    needs: define_services
    strategy:
      matrix:
        service: ${{ fromJson(needs.define_services.outputs.service_list) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Make mvnw executable
        run: chmod +x ./${{ matrix.service }}/mvnw # Предоставляем права исполнение для mvnw

      - name: Install dependencies for ${{ matrix.service }}
        run: cd ${{ matrix.service }} && ./mvnw install -DskipTests=true -f pom.xml  # Переходим в директорию сервиса

      - name: Run Unit Tests for ${{ matrix.service }}
        run: cd ${{ matrix.service }} && ./mvnw test -f pom.xml # Переходим в директорию сервиса

      - name: Run Checkstyle for ${{ matrix.service }}
        run: cd ${{ matrix.service }} && ./mvnw checkstyle:checkstyle -f pom.xml # Переходим в директорию сервиса

      - name: Generate JaCoCo Coverage Report for ${{ matrix.service }}
        run: cd ${{ matrix.service }} && ./mvnw org.jacoco:jacoco-maven-plugin:prepare-agent process-classes org.jacoco:jacoco-maven-plugin:report -f pom.xml # Переходим в директорию сервиса

      - name: Check JaCoCo Coverage for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          JACOCO_COVERAGE=$(( $(./mvnw org.jacoco:jacoco-maven-plugin:report | grep "lines.covered" | awk '{print $3}' | tr -d '%') ))
          echo "Coverage: $JACOCO_COVERAGE%"
          if [[ "$JACOCO_COVERAGE" -lt "80" ]]; then
            echo "Code coverage is less than 80%. Failing the build."
            exit 1
          fi

  docker_build_push:
    runs-on: ubuntu-latest
    needs: check_build_test
    strategy:
      matrix:
        service: ${{ fromJson(needs.define_services.outputs.service_list) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for ${{ matrix.service }}
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
