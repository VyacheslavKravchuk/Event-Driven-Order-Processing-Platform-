name: Service pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Список микросервисов
env:
  SERVICES: api-gateway auth-service user-service product-service inventory-service order-service notification-service

jobs:
  check_build_test:
    runs-on: windows-latest
    strategy:
      matrix:
        service: ${{ fromJson(env.SERVICES) }} # Преобразование строки в список

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install dependencies for ${{ matrix.service }}
        run: ./mvnw install -DskipTests=true -f ${{ matrix.service }}/pom.xml

  docker_build_push:
    runs-on: windows-latest
    needs: check_build_test
    strategy:
      matrix:
        service: ${{ fromJson(env.SERVICES) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}    docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for ${{ matrix.service }}
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

  deploy_to_k8s:
    runs-on: windows-latest
    needs: docker_build_push
    strategy:
      matrix:
        service: ${{ fromJson(env.SERVICES) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.25.0'

      - name: Configure Kubernetes context
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy ${{ matrix.service }} using kubectl
        run: kubectl apply -f ./k8s/${{ matrix.service }}.yaml